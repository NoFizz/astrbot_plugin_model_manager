<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Manager</title>
  <link rel="stylesheet" href="./style.css?v=1.4.1" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <button id="sidebarToggleBtn" class="btn btn-secondary" title="侧边栏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path transform="translate(0 24) scale(0.025)" d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h320v-560H200v560Zm560 0v-560H600v560h160Z"/></svg>
          <span data-i18n="sidebarToggle">侧边栏</span>
        </button>
        <div class="header-brand">
          <div class="header-title-row">
            <h1 class="header-title" data-i18n="title">模型管理器</h1>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="mm-icon-btn" title="刷新" aria-label="刷新">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="quickSwitchBtn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path transform="translate(0 24) scale(0.025)" d="m233-320 75 75q11 11 11 27.5T308-189q-12 12-28.5 12T251-189L108-332q-6-6-8.5-13T97-360q0-8 2.5-15t8.5-13l144-144q12-12 28-11.5t28 12.5q11 12 11.5 28T308-475l-75 75h247q17 0 28.5 11.5T520-360q0 17-11.5 28.5T480-320H233Zm494-240H480q-17 0-28.5-11.5T440-600q0-17 11.5-28.5T480-640h247l-75-75q-11-11-11-27.5t11-28.5q12-12 28.5-12t28.5 12l143 143q6 6 8.5 13t2.5 15q0 8-2.5 15t-8.5 13L708-428q-12 12-28 11.5T652-429q-11-12-11.5-28t11.5-28l75-75Z"/></svg>
          <span data-i18n="quickSwitch">单独替换</span>
        </button>
        <button id="setAllBtn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path transform="translate(0 24) scale(0.025)" d="M70-438q-12-12-11.5-28T71-494q12-11 28-11.5t28 11.5l142 142 14 14 14 14q12 12 11.5 28T296-268q-12 11-28 11.5T240-268L70-438Zm424 85 340-340q12-12 28-11.5t28 12.5q11 12 11.5 28T890-636L522-268q-12 12-28 12t-28-12L296-438q-11-11-11-27.5t11-28.5q12-12 28.5-12t28.5 12l141 141Zm169-282L522-494q-11 11-27.5 11T466-494q-12-12-12-28.5t12-28.5l141-141q11-11 27.5-11t28.5 11q12 12 12 28.5T663-635Z"/></svg>
          <span data-i18n="setAll">一键设置</span>
        </button>
        <button id="saveBtn" class="btn btn-primary" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path transform="translate(0 24) scale(0.025)" d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h447q16 0 30.5 6t25.5 17l114 114q11 11 17 25.5t6 30.5v447q0 33-23.5 56.5T760-120H200Zm560-526L646-760H200v560h560v-446ZM565-275q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM280-560h280q17 0 28.5-11.5T600-600v-80q0-17-11.5-28.5T560-720H280q-17 0-28.5 11.5T240-680v80q0 17 11.5 28.5T280-560Zm-80-86v446-560 114Z"/></svg>
          <span data-i18n="save">保存</span>
          <span id="saveBadge" class="save-badge">0</span>
        </button>
      </div>
    </header>

    <div id="loadingView" class="loading-view">
      <div class="spinner"></div>
      <p class="loading-text" data-i18n="scanning">正在扫描插件配置...</p>
    </div>

    <div id="errorView" class="error-view" style="display:none">
      <svg class="state-icon state-icon--error" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p id="errorMsg" class="error-text"></p>
      <button id="retryBtn" class="btn btn-secondary" style="margin-top:16px" data-i18n="retry">重试</button>
    </div>

    <div id="emptyView" class="empty-view" style="display:none">
      <svg class="state-icon state-icon--empty" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <p class="empty-title" data-i18n="noPlugins">未找到包含模型配置的插件</p>
      <p class="empty-hint" data-i18n="noPluginsHint">请确认其他插件的 _conf_schema.json 中使用了 select_provider 配置项</p>
    </div>

    <div id="contentView" class="content-view" style="display:none">
      <div id="pluginGroups" class="plugin-groups"></div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Quick Switch Dialog -->
    <div id="quickSwitchDialog" class="dialog-overlay" style="display:none">
      <div class="dialog">
        <div class="dialog-header">
          <h2 class="dialog-title" data-i18n="quickSwitchTitle">单独替换模型</h2>
          <button id="dialogCloseBtn" class="dialog-close">&times;</button>
        </div>
        <div class="dialog-body">
          <div class="dialog-field">
            <label class="dialog-label" data-i18n="currentModel">当前模型（要替换的）</label>
            <select id="currentModelSelect" class="field-select">
              <option value="" data-i18n="selectCurrent">-- 选择当前模型 --</option>
            </select>
          </div>
          <div class="dialog-field">
            <label class="dialog-label" data-i18n="newModel">新模型</label>
            <select id="newModelSelect" class="field-select">
              <option value="" data-i18n="selectNew">-- 选择新模型 --</option>
            </select>
          </div>
          <div id="switchPreview" class="dialog-preview" style="display:none">
            <p class="dialog-preview-text"></p>
          </div>
        </div>
        <div class="dialog-footer">
          <button id="dialogCancelBtn" class="btn btn-secondary" data-i18n="cancel">取消</button>
          <button id="dialogConfirmBtn" class="btn btn-primary" disabled data-i18n="switchAll">替换全部</button>
        </div>
      </div>
    </div>

    <!-- Set All Dialog -->
    <div id="setAllDialog" class="dialog-overlay" style="display:none">
      <div class="dialog">
        <div class="dialog-header">
          <h2 class="dialog-title" data-i18n="setAllTitle">一键设置模型</h2>
          <button id="setAllCloseBtn" class="dialog-close">&times;</button>
        </div>
        <div class="dialog-body">
          <div class="dialog-field">
            <label class="dialog-label" data-i18n="targetModel">目标模型</label>
            <select id="setAllModelSelect" class="field-select">
              <option value="" data-i18n="selectModel">-- 选择模型 --</option>
            </select>
          </div>
          <div id="setAllPreview" class="dialog-preview" style="display:none">
            <p class="dialog-preview-text"></p>
          </div>
        </div>
        <div class="dialog-footer">
          <button id="setAllCancelBtn" class="btn btn-secondary" data-i18n="cancel">取消</button>
          <button id="setAllConfirmBtn" class="btn btn-primary" disabled data-i18n="setAllConfirm">一键设置</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=1.4.1"></script>
</body>
</html>
